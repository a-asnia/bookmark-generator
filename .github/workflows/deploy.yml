name: Publish to a-asnia.github.io

# Builds the app and copies dist/ into the bookmark-generator/ folder of the
# user site repository. Needs a repository secret SITE_TOKEN: a fine-grained
# personal access token with "Contents: Read and write" on a-asnia.github.io.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Copy build into a-asnia.github.io/bookmark-generator
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.SITE_TOKEN }}
          external_repository: a-asnia/a-asnia.github.io
          publish_branch: main
          publish_dir: ./dist
          destination_dir: bookmark-generator
          keep_files: false
          commit_message: 'Update Bookmark Forge build'
